{% extends 'food/base.html' %}
{% block body %}

<div class="flex flex-col min-h-screen/2 justify-center items-center p-8">
    <h1 class="text-2xl font-bold text-blue-700"> Add Item </h1>
    <!-- form -->
    <form class=" rounded-xl shadow-xl p-8 space-y-5 w-100" method="POST">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="w-90 text-red-500"> 
            {% for e in form.non_field_errors %}
            {{e}} 
            {% endfor %}        
        </div>
        {% endif %} 
        <!-- Form Field -->
        {% for field in form %}
        <div> 
            {% for error in field.errors %}
                <div class="text-red-500 text-sm mt-1 mb-1">{{ error }}</div>
            {% endfor %}
            <label class="py-2">{{field.label}}</label>
            <div class="border rounded py-2 px-5">{{field}}</div>
        </div>
        {% endfor %}
        <button class="bg-blue-600 hover:bg-blue-700 text-white py-2 w-full rounded"
        type="submit">Save</button>
    </form>
</div>
{% endblock %}
