{% extends 'food/base.html' %}
<!-- Comment -->
{% block body %}

<div class="flex flex-col justify-center items-center min-h-screen/2 p-10 bg-gray-50 w-full/2" >
    <h1 class="text-2xl font-bold text-blue-700">Login</h1>
    <form class="shadow-xl rounded-lg p-8 space-y-6" method="POST">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="w-90 text-red-500"> 
            {% for e in form.non_field_errors %}
            {{e}} 
            {% endfor %}        
        </div>
        {% endif %}
        <div>
            <div class=" py-2"><label  for="">Username</label></div>
            <div class="border rounded py-2 px-5">{{form.username}}</div>
        </div>

        <div>
            <div class="py-2"><label>Password</label></div>
            <div class="border rounded py-2 px-5" > {{form.password}} </div>
        </div>

        <button class="bg-blue-600 hover:bg-blue-700 text-white py-2 w-full rounded" 
        type="submit">login</button>

    </form>
</div>

{% endblock %}
